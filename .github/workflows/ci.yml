name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Lint
        run: ruff check app tests
      - name: Quality gate (naming, docs, tests, score)
        run: python tools/quality_gate.py

  docker:
    runs-on: ubuntu-latest
    needs: [quality, frontend]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --tag mini-rag:ci .
      - name: Run Compose smoke test
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          MINIO_ROOT_USER: ci-minio-user
          MINIO_ROOT_PASSWORD: ci-minio-password
          APP_PORT: 41873
        run: |
          set -euo pipefail
          trap 'docker compose down -v --remove-orphans' EXIT
          docker compose up -d --build postgres minio ntc_document_rag frontend
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:${APP_PORT}/health; then
              curl --fail --silent --show-error http://localhost:4173/ >/dev/null
              echo
              echo "Compose API and frontend smoke test passed"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color ntc_document_rag frontend postgres minio
          exit 1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
