[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N", "D101", "D102", "D103"]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D102", "D103"]
"tools/**/*.py" = ["D101", "D102", "D103"]
"evaluation/**/*.py" = ["D101", "D102", "D103"]
