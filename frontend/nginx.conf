server {
    listen 80;
    server_name _;

    # Allow large PDF/DOCX uploads; the API applies its own MAX_UPLOAD_BYTES
    # validation after the request reaches the backend.
    client_max_body_size 512m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://ntc_document_rag:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /documents {
        proxy_pass http://ntc_document_rag:8000;
        proxy_set_header Host $host;
    }

    location /query {
        proxy_pass http://ntc_document_rag:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://ntc_document_rag:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
