server {
    listen 80;
    server_name _;

    # Docker Compose may recreate the API container while the frontend stays
    # alive. Resolve the service name through Docker DNS at request time so
    # nginx never keeps a stale container IP after a worker/API restart.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $rag_api http://ntc_document_rag:8000;

    # Allow large PDF/DOCX uploads; the API applies its own MAX_UPLOAD_BYTES
    # validation after the request reaches the backend.
    client_max_body_size 512m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass $rag_api;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /documents {
        proxy_pass $rag_api;
        proxy_set_header Host $host;
    }

    location /query {
        proxy_pass $rag_api;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass $rag_api;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
